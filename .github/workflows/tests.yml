name: Windows scientific regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen dependencies and local package
        run: |
          python -m pip install --require-hashes -r requirements/windows-py313.lock.txt
          python -m pip install --no-deps -e .
      - name: Run tests including arboreto adapters
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Preserve test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
